<html>
    <head>
        <title>javascript multiplication</title>
    </head>
    <body>
        <h1>simple multiplication</h1>
        <script>
            let num1=4*3;
            let num2=5*9;
            let num3=6*4;

            document.write("4 × 3 = " + num1 + "<br>");
            document.write("5 × 9 = " + num2 + "<br>");
            document.write("6 × 4 = " + num3 + "<br>");
        </script>
    </body>
</html>
